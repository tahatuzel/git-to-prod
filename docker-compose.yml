services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5157:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NUXT_API_BASE_URL: http://backend:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
