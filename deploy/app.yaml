apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      nodeSelector:
        app-node: "true"
      containers:
        - name: backend
          image: ghcr.io/tahatuzel/git-to-prod-backend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: todo-db
                  key: connectionString
          readinessProbe:
            httpGet:
              path: /api/todo-items
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend
  namespace: todo
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-frontend
  namespace: todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-frontend
  template:
    metadata:
      labels:
        app: todo-frontend
    spec:
      nodeSelector:
        app-node: "true"
      containers:
        - name: frontend
          image: ghcr.io/tahatuzel/git-to-prod-frontend:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NUXT_API_BASE_URL
              value: http://todo-backend:8080
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: todo-frontend
  namespace: todo
spec:
  type: ClusterIP
  selector:
    app: todo-frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo
  namespace: todo
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todo-frontend
                port:
                  number: 3000
