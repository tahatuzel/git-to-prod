name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-main:
    name: Verify main branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main

  backend-ci:
    needs: verify-main
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    needs: verify-main
    uses: ./.github/workflows/frontend-ci.yml

  migrate:
    name: Apply EF Core migrations on DB VM
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DB_INSTANCE_ID: ${{ vars.DB_INSTANCE_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install EF Core tool
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build Linux migration bundle
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=gitToProdDB;Username=todo_app;Password=unused
        run: |
          dotnet ef migrations bundle \
            --project backend/src/Infrastructure/Infrastructure.csproj \
            --startup-project backend/src/Api/Api.csproj \
            --configuration Release \
            --self-contained \
            --target-runtime linux-x64 \
            --output "$RUNNER_TEMP/efbundle"
          test -x "$RUNNER_TEMP/efbundle"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up SSM SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/setup-ssm-ssh.sh

      - name: Copy and run bundle on DB VM
        env:
          DB_CONNECTION_STRING_LOCAL: ${{ secrets.DB_CONNECTION_STRING_LOCAL }}
        run: |
          set -euo pipefail
          : "${DB_INSTANCE_ID:?DB_INSTANCE_ID is required}"
          : "${DB_CONNECTION_STRING_LOCAL:?DB_CONNECTION_STRING_LOCAL is required}"
          ssh-keygen -F "$DB_INSTANCE_ID" -f "$HOME/.ssh/known_hosts" > /dev/null
          remote_dir="/home/ec2-user/.git-to-prod/migration/$GITHUB_SHA"
          ssh "$DB_INSTANCE_ID" "mkdir -p '$remote_dir'"
          scp "$RUNNER_TEMP/efbundle" \
            backend/src/Api/appsettings.json \
            .github/scripts/run-migration.sh \
            "$DB_INSTANCE_ID:$remote_dir/"
          printf '%s\n' "$DB_CONNECTION_STRING_LOCAL" |
            ssh "$DB_INSTANCE_ID" "bash '$remote_dir/run-migration.sh' '$GITHUB_SHA'"

  publish:
    name: Publish images to GHCR
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ghcr.io/tahatuzel/git-to-prod-backend:${{ github.sha }}

      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/tahatuzel/git-to-prod-frontend:${{ github.sha }}

      - name: Show first-release action
        if: ${{ vars.GHCR_PUBLIC_READY != 'true' }}
        run: |
          echo 'Both GHCR packages must be public before the first K3s deployment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Set GHCR_PUBLIC_READY=true, then run Release on main manually.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to K3s
    needs: publish
    if: ${{ vars.GHCR_PUBLIC_READY == 'true' }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      K3S_SERVER_INSTANCE_ID: ${{ vars.K3S_SERVER_INSTANCE_ID }}
      APPLICATION_URL: ${{ vars.APPLICATION_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Verify images are public
        run: |
          docker manifest inspect "ghcr.io/tahatuzel/git-to-prod-backend:$GITHUB_SHA" > /dev/null
          docker manifest inspect "ghcr.io/tahatuzel/git-to-prod-frontend:$GITHUB_SHA" > /dev/null

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up SSM SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: bash .github/scripts/setup-ssm-ssh.sh

      - name: Apply K3s manifests
        env:
          DB_CONNECTION_STRING_K3S: ${{ secrets.DB_CONNECTION_STRING_K3S }}
        run: |
          set -euo pipefail
          : "${K3S_SERVER_INSTANCE_ID:?K3S_SERVER_INSTANCE_ID is required}"
          : "${DB_CONNECTION_STRING_K3S:?DB_CONNECTION_STRING_K3S is required}"
          ssh-keygen -F "$K3S_SERVER_INSTANCE_ID" -f "$HOME/.ssh/known_hosts" > /dev/null
          remote_dir="/home/ec2-user/.git-to-prod/deploy/$GITHUB_SHA"
          ssh "$K3S_SERVER_INSTANCE_ID" "mkdir -p '$remote_dir'"
          scp deploy/app.yaml deploy/apply.sh deploy/apply-secret.sh \
            "$K3S_SERVER_INSTANCE_ID:$remote_dir/"
          ssh "$K3S_SERVER_INSTANCE_ID" 'sudo k3s kubectl apply -f -' < deploy/namespace.yaml
          printf '%s' "$DB_CONNECTION_STRING_K3S" |
            ssh "$K3S_SERVER_INSTANCE_ID" "bash '$remote_dir/apply-secret.sh'"
          ssh "$K3S_SERVER_INSTANCE_ID" "bash '$remote_dir/apply.sh' '$GITHUB_SHA'"

      - name: Check public application and API proxy
        run: |
          : "${APPLICATION_URL:?APPLICATION_URL is required}"
          curl --fail --silent --show-error --retry 40 --retry-delay 5 \
            --output /dev/null "${APPLICATION_URL%/}/"
          curl --fail --silent --show-error --retry 40 --retry-delay 5 \
            --output /dev/null "${APPLICATION_URL%/}/api/todo-items"
