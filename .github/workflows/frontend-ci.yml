name: Frontend CI

on:
  workflow_call:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11.17.0
        run: npm install --global npm@11.17.0

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: frontend

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11.17.0
        run: npm install --global npm@11.17.0

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Nuxt typecheck
        run: npm run typecheck
        working-directory: frontend

  tests:
    name: npm run test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use npm 11.17.0
        run: npm install --global npm@11.17.0

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run existing frontend tests
        run: npm run test
        working-directory: frontend

  frontend-image:
    name: Frontend Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          load: true
          tags: todo-frontend:ci

      - name: Verify frontend image was built
        run: docker image inspect todo-frontend:ci
